[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aireview"
version = "0.1.0"
description = "Local AI git diff reviewer powered by Ollama, Pydantic and Rich"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.4",
    "pydantic>=2.5",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
aireview = "aireview.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aireview"]
